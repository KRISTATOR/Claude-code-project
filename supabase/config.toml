# Supabase CLI configuration, used for the local stack in CI (`supabase start`)
# and for deploying to the real project (`supabase db push`).
project_id = "zazemi"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1"
enable_signup = true
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
# Supabase's built-in mailer cannot reach players; see docs/PLAN.md §1 item 14.
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false

[functions.admin-set-password]
verify_jwt = true
