name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: on this repository's plan a second parallel job often
  # waited for a runner until it was cancelled. Everything runs in sequence,
  # and the end-to-end tests run against the official Supabase stack.
  ci:
    name: Checks, RLS tests and e2e on the official Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and RLS tests on PGlite
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies supabase/migrations)
        run: supabase start -x studio,imgproxy,vector,logflare,postgres-meta,supavisor

      - name: RLS tests against Supabase Postgres
        env:
          ZAZEMI_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:db

      - name: Export stack details for e2e
        run: |
          supabase status -o env > supabase.env
          url="$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')"
          key="$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')"
          echo "ZAZEMI_E2E_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "ZAZEMI_E2E_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      - name: Build (test build)
        run: npm run build:test

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # needs; re-allow them for this throwaway runner.
      - name: Allow Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests against Supabase (Electron under Xvfb)
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
