name: Deploy database

# Applies supabase/migrations and deploys the Edge Functions to the real
# Supabase project. Started by hand only (Actions → Deploy database → Run
# workflow), so schema changes are always deliberate. See docs/SETUP.md, step 6.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would change'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check configuration
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing – see docs/SETUP.md, step 6."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            supabase db push --dry-run
          else
            supabase db push
          fi

      - name: Deploy Edge Functions
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy admin-set-password --project-ref "$SUPABASE_PROJECT_REF" --use-api
